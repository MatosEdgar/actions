name: Issue Trigger Workflow

permissions:
  issues: write

on: 
  issues:
    types: [opened, edited, closed, labeled]

jobs:
  issue-job:
    runs-on: ubuntu-latest

    steps:
    - name: Informações da Issue
      run:
        echo: "Workflow disparado por ISSUE"
        echo: "Ação: ${{ github.event.action }}"
        echo: "Issue #${{ git.event.issue.number }}"
        echo: "Titulo: ${{ github.event.issue.title }}"
        echo: "Autor: ${{ github.event.issue.user.login }}"
        echo: "Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}"

    - name: Resposta automática (nova issue)
      if: github.event.action == 'opened'
      uses: actions/github-script@v7
      with:
        script:
          github.rest.issues.createContent({
          issue_number: context.issue.number,
          owner: context.repo.owner,
          repo: context.repo.repo,
          body: "Obrigador por reportar essa issue! nossa equipe ira analisá-la em breve."  
        })